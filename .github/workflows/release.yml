name: Release

# 打 tag（v*）时：构建全平台产物 → GitHub Release → npm（OIDC Trusted Publishing）
#
# ── 为什么要单 job + self-hosted ──────────────────────────────────────────
# 早期版本把 16 个产物摊成 16 个 matrix job。实测本地串行交叉编译全部平台只要
# 100 秒（本机 8 核首次冷缓存；热缓存 ~10s，改后并发版热缓存 ~4.4s），而 16 个
# job 每个都要 checkout + setup-go + 拉 Go 缓存 + 启动 runner，单次发布烧掉约
# 15 分钟免费额度。本项目的 Go 交叉编译不需要各平台 runner（CGO_ENABLED=0，
# 纯 Go），所以合成一个 job 反而快且省。
#
# runner 选择：优先 self-hosted（jixoai 组织级 mac-ext-01，常驻且已有模块缓存），
# 官方托管 runner 作为兜底——self-hosted 掉线时 CI 仍能跑完。
#
# ── 为什么是「单 job 内并发」而不是「多 job 并行」（2026-11-13 定稿） ──────
# 单 job 串行 for 循环的问题是只吃一个核：本机 8 核实测 16 个产物串行
# 9.0-10.2s（热缓存），期间 7 个核在睡觉。但把它摊回 matrix 是错的解法：
#   - self-hosted 只有一台机器，多个 job 会在同一台 runner 上排队（job 之间没有
#     共享缓存优势，却各自 checkout + setup-go），总墙钟时间不会变短；
#   - 每个 matrix job 在官方 runner 上都单独计费，回到「15 分钟额度」老路。
# 所以并发放在 job 内部（xargs -P），并发度按实际核数探测，官方 2 核 runner
# 上自然退化成 2，不会被拖垮。详见 Build all platforms 步骤的注释。
#
# 冷缓存下的真实收益（2026-11-13 本机 8 核实测，含机器其它负载）：
#   串行 108s / 并发 97s —— 只快 12%。原因不是并发无效，而是 16 个产物只有
#   6 种 (OS,arch) 依赖图，冷缓存时 8 路会同时把同一份依赖图各编一遍，CPU
#   时间反而从 360s 涨到 434s。所以本改动的价值主要在**热缓存**场景（self-hosted
#   常驻、go 模块与 build cache 都在，实测 2.2 倍），这与 mac-ext-01 的实际
#   使用方式一致（它是常驻 runner，不是每次新开）。冷缓存下并发也不会更慢到
#   不可接受，故无需为它做两阶段预热（那会让热路径多花一次空转）。
#
# ── npm Trusted Publishing ────────────────────────────────────────────────
# npmjs.com → reply9842 → Settings → Trusted Publisher 必须与本文件严格一致：
#   Repository:  jixoai/reply9842
#   Workflow:    release.yml
#   Environment: npm-publish        ← job 里必须有 environment: npm-publish
# GitHub 的 OIDC token 带 environment claim，npm 用它匹配。缺这一项的表现是
# 404「package not found」，极易误判为包不存在。

on:
  push:
    tags:
      - "v*"
  # 手动预演：只构建 + 测，不建 release、不发 npm
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── runner 选择 ───────────────────────────────────────────────────────────
  #
  # GitHub 的 runs-on 数组是 **AND**（runner 必须同时具备所有标签），不是优先
  # 级列表。所以 `[self-hosted, ubuntu-latest]` 永远匹配不到任何 runner——这
  # 一点很容易想当然，2026-11-13 差点因此把发布彻底卡死。
  #
  # 唯一可行的兜底：先用一个极轻的 job 探测，再决定主 job 去哪跑。
  # 探测本身跑官方 runner（几秒）。
  #
  # 探测逻辑的坑（2026-11-13 实证翻车）：
  #  - GITHUB_TOKEN 没有 admin:org 权限，/actions/runners 返回 403，gh 把
  #    **错误体打到 stdout**；早先写的 `| grep -qv '^0$'` 见到非 "0" 行就
  #    判定「有 runner」，日志打印「self-hosted 在线」后 job 卡 queued 22 分钟。
  #  - 且 API 报 online ≠ runner 接得了活：实测 runner 进程活着、broker 长轮询
  #    正常，07:59 一次 TLS 抖动后静默挂死，API 仍报 online。
  #
  # 所以探测只做「尽力优先」，真正的安全网是主 job 的 timeout-minutes：
  # 卡在排队阶段时 timeout 不生效，因此改用 step 级 30 分钟上限之外，还要
  # 接受「最坏情况手动重跑」。官方 runner 兜底能力已在没有 self-hosted 的
  # 仓库验证过（v0.1.0 用 ubuntu-latest 跑通过）。
  pick-runner:
    name: Pick runner
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.pick.outputs.label }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # 用 python 严格解析 JSON：API 失败（403 错误体）必须与「0 个 runner」
          # 同等对待，绝不能因为 stdout 里有字就当成有 runner。
          resp="$(gh api repos/${{ github.repository }}/actions/runners 2>/dev/null || true)"
          online="$(printf '%s' "$resp" | python3 -c '
          import json,sys
          try:
              d=json.load(sys.stdin)
              rs=d.get("runners") or []
              print(sum(1 for r in rs if r.get("status")=="online"))
          except Exception:
              print(-1)   # 非合法 JSON / 403 错误体 → 视为不可用
          ')"
          echo "online runner 数: $online"
          if [ "$online" -gt 0 ] 2>/dev/null; then
            echo "label=self-hosted" >> "$GITHUB_OUTPUT"
            echo "→ self-hosted（$online 个 online）"
          else
            echo "label=ubuntu-latest" >> "$GITHUB_OUTPUT"
            echo "→ ubuntu-latest（online=${online}）"
          fi

  release:
    name: Build and publish
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.label }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          # self-hosted 上用本地缓存目录，避免每次从 GitHub 拉 Go 工具链
          cache: true

      - name: Verify toolchain
        run: |
          go version
          node --version || echo "node 缺失（npm 步骤会单独 setup）"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Resolve version
        id: ver
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version=$v"

      - name: Build all platforms
        id: build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail

          # ── 并发度探测（自适应核数） ────────────────────────────────────
          # 探测顺序按「哪台机器都可能跑」排：
          #   nproc        → coreutils（Linux / 官方 runner）
          #   getconf      → macOS 自带，返回逻辑核数（self-hosted mac-ext-01 走这条）
          #   sysctl       → macOS 兜底
          # 注意 macOS 默认**没有 nproc**（2026-11-13 本机实测确认），只写 nproc
          # 会让 self-hosted 一路掉到 fallback，等于没并发。
          cores=""
          if command -v nproc >/dev/null 2>&1; then
            cores="$(nproc 2>/dev/null || true)"
          fi
          if [ -z "$cores" ] && command -v getconf >/dev/null 2>&1; then
            cores="$(getconf _NPROCESSORS_ONLN 2>/dev/null || true)"
          fi
          if [ -z "$cores" ] && command -v sysctl >/dev/null 2>&1; then
            cores="$(sysctl -n hw.ncpu 2>/dev/null || true)"
          fi
          case "$cores" in ''|*[!0-9]*) cores=2 ;; esac
          if [ "$cores" -lt 1 ]; then cores=2; fi

          # 产物清单（3 kinds × 3 os × 2 arch，去掉 gui/linux → 16 个）
          targets=()
          for kind in cli gui server; do
            for os in linux darwin windows; do
              for arch in amd64 arm64; do
                # GUI 只有 darwin / windows（mygo native UI 无 Linux 后端）
                if [ "$kind" = "gui" ] && [ "$os" = "linux" ]; then continue; fi
                targets+=("${kind} ${os} ${arch}")
              done
            done
          done
          total="${#targets[@]}"

          # jobs = min(核数, 产物数, 8)
          #   · 官方 runner（2-4 核）自然退化成 2-4，不会被并发拖垮；
          #   · 上限 8 是内存护栏：单个 GUI 链接实测峰值 RSS ≈ 270MB，
          #     8 路 ≈ 2.2GB 可接受；再往上只会在 32 核机上把 link 峰值叠到
          #     4GB+，而墙钟时间已被「16 个产物 / link 耗时」主导，意义不大。
          jobs="$cores"
          if [ "$jobs" -gt "$total" ]; then jobs="$total"; fi
          if [ "$jobs" -gt 8 ]; then jobs=8; fi
          if [ "$jobs" -lt 1 ]; then jobs=2; fi

          # 每个 go build 内部还能再并行编译包（-p 默认 = GOMAXPROCS）。
          # 若不加约束，8 路 × 每路 8 线程 = 64 个编译进程互相抢核。
          # 按 cores/jobs 上取整摊分（下取整会在 12 核这类非整数倍上白闲 4 个核），
          # 钳在 1..4。
          go_p=$(( (cores + jobs - 1) / jobs ))
          if [ "$go_p" -lt 1 ]; then go_p=1; fi
          if [ "$go_p" -gt 4 ]; then go_p=4; fi

          echo "并发度: cores=$cores jobs=$jobs go_p=$go_p 产物=$total"

          rm -rf dist && mkdir -p dist

          # 单目标构建脚本：参数 $1 = "kind os arch"
          # 写成文件而不是 xargs + bash -c，是为了避开三层引号转义（本项目已多次
          # 被转义层坑过）。xargs -I '{}' 保证整行作为一个参数、绝不拆词。
          log_dir="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/r9842-build-logs"
          rm -rf "$log_dir" && mkdir -p "$log_dir"
          script="$log_dir/build-one.sh"
          cat > "$script" <<'SH'
          #!/usr/bin/env bash
          # 由 release.yml 生成，勿手改。
          set -euo pipefail
          read -r kind os arch <<< "${1:?缺少目标参数}"

          ext=""
          if [ "$os" = "windows" ]; then ext=".exe"; fi
          out="dist/${kind}-${os}-${arch}${ext}"

          ld="-s -w -X main.version=${VERSION}"
          # Windows GUI 双击不弹控制台（go install 传不了，另有 console_windows.go 兜底）
          if [ "$kind" = "gui" ] && [ "$os" = "windows" ]; then
            ld="$ld -H=windowsgui"
          fi

          # 日志必须落在 dist 之外：dist/* 会被整目录上传/发布。
          log="${LOG_DIR}/${kind}-${os}-${arch}.log"
          if ! GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -p "$GO_P" -trimpath -ldflags "$ld" -o "$out" "./cmd/${kind}" \
              >"$log" 2>&1; then
            echo "✗ 构建失败: $out" >&2
            sed 's/^/    /' "$log" >&2 || true
            exit 1
          fi
          printf '✓ %-24s %s\n' "$out" "$(du -h "$out" | cut -f1)"
          SH

          # 并发跑。xargs 在任一子进程非 0 时退出 123；这里**不**让 set -e 立刻
          # 中断，而是记下状态继续跑完整性检查——失败时同时给出「哪个目标炸了」
          # （子脚本已经打印了编译器输出）和「最终缺了哪些产物」，一次看全。
          build_rc=0
          printf '%s\n' "${targets[@]}" \
            | LOG_DIR="$log_dir" GO_P="$go_p" \
              xargs -P "$jobs" -I '{}' bash "$script" '{}' || build_rc=$?

          # ── 完整性断言：产物一个都不能少、不能是空的 ────────────────────
          # 并发的失败模式是「静默少一个」，靠下面逐一比对清单兜住。
          missing=0
          for t in "${targets[@]}"; do
            read -r kind os arch <<< "$t"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            f="dist/${kind}-${os}-${arch}${ext}"
            if [ ! -s "$f" ]; then
              echo "✗ 缺失或空文件: $f" >&2
              missing=$((missing+1))
            fi
          done
          if [ "$build_rc" -ne 0 ]; then
            echo "构建阶段有目标失败（xargs rc=${build_rc}），缺失 ${missing} 个产物" >&2
            exit 1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "共 $missing 个产物缺失，中止" >&2
            exit 1
          fi

          echo "built=$total" >> "$GITHUB_OUTPUT"
          echo "共 $total 个产物（并发 $jobs 路）"
          ls -lh dist

      - name: Self-check binaries
        run: |
          set -euo pipefail
          # 自检分两层：
          #  1) 格式层——全部 16 个产物都用 file 看一遍，确认架构/子系统正确
          #  2) 执行层——只跑「宿主平台 + 宿主架构」那一份
          #
          # 第 2 层不能写死 cli-darwin-arm64：pick-runner 回退到 ubuntu-latest
          # 时那是个 Mach-O，Linux 执行会报 Exec format error（exit 126），
          # 而这一步排在发 Release 之前，会连带挡掉整个发版。2026-11-13 实证。
          for f in dist/*; do
            file "$f" | sed 's/^/  /'
          done

          # GUI 的 Windows 产物必须是 GUI 子系统
          file dist/gui-windows-amd64.exe | grep -q "GUI" \
            || { echo "gui-windows 不是 GUI 子系统"; exit 1; }

          # 找一份能在本机直接执行的 cli 产物
          case "$(uname -s)" in
            Darwin) host_os=darwin ;;
            Linux)  host_os=linux ;;
            *)      host_os=unknown ;;
          esac
          case "$(uname -m)" in
            arm64|aarch64) host_arch=arm64 ;;
            x86_64|amd64)  host_arch=amd64 ;;
            *)             host_arch=unknown ;;
          esac
          host_bin="dist/cli-${host_os}-${host_arch}"
          if [ -x "$host_bin" ]; then
            echo "执行自检: $host_bin"
            "$host_bin" version
          else
            echo "宿主 ${host_os}/${host_arch} 没有对应的 cli 产物，跳过执行层自检"
            echo "（格式层已全部检查）"
          fi

      - name: Upload artifacts (给 npm job 用)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*
          retention-days: 3

      - name: Checksums
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          cd dist
          # 注意排除 SHA256SUMS.txt 自身：workflow 重跑时它已存在，会把
          # 自己也算进去。用 glob 而不是 ls|grep，避免文件名带特殊字符时出错。
          shopt -s extglob nullglob
          files=(!(*SHA256SUMS.txt))
          if [ ${#files[@]} -eq 0 ]; then
            echo "dist 为空，没有可校验的产物" >&2
            exit 1
          fi
          # shasum 是 macOS 自带（Perl），ubuntu 只有 sha256sum；self-hosted 与
          # 官方 runner 都会跑到这一步，所以两条路都要通。
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${files[@]}" > SHA256SUMS.txt
          else
            shasum -a 256 "${files[@]}" > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 安装

            ### npm（一个包内含全平台 CLI / GUI / 服务端）

            ```bash
            npx reply9842@${{ github.ref_name }}          # 本地转发客户端
            npx reply9842-gui@${{ github.ref_name }}      # 图形界面
            npx reply9842-server@${{ github.ref_name }}   # 服务端

            npm i -g reply9842@${{ github.ref_name }}     # 或全局安装
            ```

            ### go install（需要 Go 1.27.3+）

            ```bash
            go install github.com/jixoai/reply9842/cmd/cli@${{ github.ref_name }}
            go install github.com/jixoai/reply9842/cmd/gui@${{ github.ref_name }}
            go install github.com/jixoai/reply9842/cmd/server@${{ github.ref_name }}
            ```

            ### 下载预编译二进制

            见下方 Assets，校验和见 `SHA256SUMS.txt`。

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── npm 独立 job：需要 environment + id-token，且要 Node 环境 ──────────
      # 单独成 job 是因为 environment 的保护规则与 OIDC 权限都按 job 生效；
      # needs 传递 dist 目录（self-hosted 与官方 runner 不共享文件系统，
      # 所以这里用 artifact 中转）。

  npm:
    name: Publish npm
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    # 必须与 npmjs.com Trusted Publisher 的 Environment name 完全一致
    environment: npm-publish
    runs-on: ubuntu-latest          # npm 发布用官方 runner 即可（无需自建）
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write               # OIDC 必需
    steps:
      - uses: actions/checkout@v4

      # 不传 registry-url：它会让 setup-node 写 NODE_AUTH_TOKEN 到 .npmrc，
      # npm 见到该变量就走 Basic Auth，OIDC 换来的凭证被忽略（实测 E404）。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Upgrade npm (Trusted Publishing 需要 CLI 11+)
        run: npm install -g npm@latest

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: npm/vendor

      - name: OIDC preconditions
        # npm 的 oidc() 在任一前置条件失败时只是 log.verbose + return undefined，
        # 最终统一表现为 ENEEDAUTH，无法从错误码区分。这步把条件逐个打印。
        run: |
          echo "npm: $(npm --version)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+set}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+set}"
          echo "NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-unset}"

      - name: Set version
        working-directory: npm
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.version = process.env.VERSION.replace(/^v/, "");
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
            console.log("version ->", p.version);
          '

      - name: Prepare package
        run: |
          set -euo pipefail
          chmod 0755 npm/vendor/cli-* npm/vendor/gui-* npm/vendor/server-* 2>/dev/null || true
          chmod 0644 npm/vendor/*.exe 2>/dev/null || true
          cp README.md LICENSE npm/

      - name: Publish
        working-directory: npm
        # 环境里绝不能有 NODE_AUTH_TOKEN（哪怕空串）：npm 会认为已有凭据配置，
        # OIDC 分支被跳过。同时清掉可能残留的 .npmrc。
        run: |
          rm -f ~/.npmrc .npmrc 2>/dev/null || true
          npm publish --provenance --access public --loglevel verbose

  # ── Docker 镜像（服务端一键部署）─────────────────────────────────────────
  #
  # 为什么必须有这个 job（2026-11-13 实证）：`docker-compose.server.yml` 与
  # DEPLOY.md 都让用户 `docker compose up -d`，引用
  # `ghcr.io/jixoai/reply9842-server:latest`，而此前**没有任何 workflow 构建
  # 这个镜像**——`gh api repos/.../pkgs/container/reply9842-server` 返回 Not Found。
  # 也就是说照文档走一遍必然拉不到镜像。Dockerfile.server 一直是好的，只是没人跑它。
  #
  # 只在 tag 上构建（workflow_dispatch 干跑不推镜像，避免污染 latest）。
  docker:
    name: Build and push image
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write               # 推 ghcr 必需
    steps:
      - uses: actions/checkout@v4

      # QEMU + buildx：镜像要同时支持 amd64（服务器主流）与 arm64（部分云厂商）
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        # 镜像推完必须验证它真的能起来，否则「构建成功但跑不起来」会一路传到用户。
        #
        # 两步，缺一不可：
        #  1. 不带参数跑（覆盖 ENTRYPOINT，绕开 CMD 里的 -cert）→ 必须打印参数校验错误
        #  2. 挂自签证书真跑起来 → /healthz 必须 200
        #
        # 第 2 步是 2026-11-13 补的：只验第 1 步时，镜像里 stats 初始化写
        # `/.reply9842` 被 permission denied 打死（非 root + HOME=/），
        # 而第 1 步在 CMD 已经给了 -cert 的情况下根本走不到那里。
        run: |
          set -euo pipefail
          img="ghcr.io/${{ github.repository }}-server:latest"
          docker pull "$img"

          # 必须把 -cert/-key 显式传空：--entrypoint 只覆盖 ENTRYPOINT，
          # 镜像的 CMD 仍会作为参数追加进来，于是「不带参数」根本测不到。
          if docker run --rm --entrypoint /reply9842-server "$img" -cert "" -key "" 2>&1 | grep -q "必须提供 -cert 与 -key"; then
            echo "✓ 参数校验生效"
          else
            echo "❌ 参数校验没触发" >&2
            docker run --rm --entrypoint /reply9842-server "$img" 2>&1 | tail -20 >&2 || true
            exit 1
          fi

          workdir="$(mktemp -d)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$workdir/key.pem" -out "$workdir/cert.pem" 2>/dev/null
          # 容器里是 UID 65532：临时证书必须让它读得到（生产部署同理，见 DEPLOY.md）
          chmod 644 "$workdir/key.pem" "$workdir/cert.pem"
          docker run -d --name r9842-smoke \
            -v "$workdir/cert.pem:/certs/fullchain.pem:ro" \
            -v "$workdir/key.pem:/certs/privkey.pem:ro" \
            -p 18080:8080 "$img" >/dev/null
          ok=""
          for _ in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "❌ 容器起来了但 /healthz 不通" >&2
            docker logs r9842-smoke 2>&1 | tail -30 >&2 || true
            docker rm -f r9842-smoke >/dev/null 2>&1 || true
            exit 1
          fi
          echo "✓ 容器运行中且 /healthz 返回 200"
          docker rm -f r9842-smoke >/dev/null

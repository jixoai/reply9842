name: Release

# 打 tag（v*）时：构建全平台产物 → GitHub Release → npm（OIDC Trusted Publishing）
#
# ── 为什么要单 job + self-hosted ──────────────────────────────────────────
# 早期版本把 13 个平台摊成 13 个 matrix job。实测本地串行交叉编译全部平台只要
# 65 秒，而 13 个 job 每个都要 checkout + setup-go + 拉 Go 缓存 + 启动 runner，
# 单次发布烧掉约 15 分钟免费额度。本项目的 Go 交叉编译不需要各平台 runner
# （CGO_ENABLED=0，纯 Go），所以合成一个 job 反而快且省。
#
# runner 选择：优先 self-hosted（jixoai 组织级 mac-ext-01，常驻且已有模块缓存），
# 官方托管 runner 作为兜底——self-hosted 掉线时 CI 仍能跑完。
#
# ── npm Trusted Publishing ────────────────────────────────────────────────
# npmjs.com → reply9842 → Settings → Trusted Publisher 必须与本文件严格一致：
#   Repository:  jixoai/reply9842
#   Workflow:    release.yml
#   Environment: npm-publish        ← job 里必须有 environment: npm-publish
# GitHub 的 OIDC token 带 environment claim，npm 用它匹配。缺这一项的表现是
# 404「package not found」，极易误判为包不存在。

on:
  push:
    tags:
      - "v*"
  # 手动预演：只构建 + 测，不建 release、不发 npm
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── runner 选择 ───────────────────────────────────────────────────────────
  #
  # GitHub 的 runs-on 数组是 **AND**（runner 必须同时具备所有标签），不是优先
  # 级列表。所以 `[self-hosted, ubuntu-latest]` 永远匹配不到任何 runner——这
  # 一点很容易想当然，2026-11-13 差点因此把发布彻底卡死。
  #
  # 唯一可行的兜底：先用一个极轻的 job 探测，再决定主 job 去哪跑。
  # 探测本身跑官方 runner（几秒）。
  #
  # 探测逻辑的坑（2026-11-13 实证翻车）：
  #  - GITHUB_TOKEN 没有 admin:org 权限，/actions/runners 返回 403，gh 把
  #    **错误体打到 stdout**；早先写的 `| grep -qv '^0$'` 见到非 "0" 行就
  #    判定「有 runner」，日志打印「self-hosted 在线」后 job 卡 queued 22 分钟。
  #  - 且 API 报 online ≠ runner 接得了活：实测 runner 进程活着、broker 长轮询
  #    正常，07:59 一次 TLS 抖动后静默挂死，API 仍报 online。
  #
  # 所以探测只做「尽力优先」，真正的安全网是主 job 的 timeout-minutes：
  # 卡在排队阶段时 timeout 不生效，因此改用 step 级 30 分钟上限之外，还要
  # 接受「最坏情况手动重跑」。官方 runner 兜底能力已在没有 self-hosted 的
  # 仓库验证过（v0.1.0 用 ubuntu-latest 跑通过）。
  pick-runner:
    name: Pick runner
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.pick.outputs.label }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # 用 python 严格解析 JSON：API 失败（403 错误体）必须与「0 个 runner」
          # 同等对待，绝不能因为 stdout 里有字就当成有 runner。
          resp="$(gh api repos/${{ github.repository }}/actions/runners 2>/dev/null || true)"
          online="$(printf '%s' "$resp" | python3 -c '
          import json,sys
          try:
              d=json.load(sys.stdin)
              rs=d.get("runners") or []
              print(sum(1 for r in rs if r.get("status")=="online"))
          except Exception:
              print(-1)   # 非合法 JSON / 403 错误体 → 视为不可用
          ')"
          echo "online runner 数: $online"
          if [ "$online" -gt 0 ] 2>/dev/null; then
            echo "label=self-hosted" >> "$GITHUB_OUTPUT"
            echo "→ self-hosted（$online 个 online）"
          else
            echo "label=ubuntu-latest" >> "$GITHUB_OUTPUT"
            echo "→ ubuntu-latest（online=$online）"
          fi

  release:
    name: Build and publish
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.label }}
    timeout-minutes: 30
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.label }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          # self-hosted 上用本地缓存目录，避免每次从 GitHub 拉 Go 工具链
          cache: true

      - name: Verify toolchain
        run: |
          go version
          node --version || echo "node 缺失（npm 步骤会单独 setup）"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Resolve version
        id: ver
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version=$v"

      - name: Build all platforms
        id: build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          ldflags="-s -w -X main.version=${VERSION}"
          made=0
          for kind in cli gui server; do
            for os in linux darwin windows; do
              for arch in amd64 arm64; do
                # GUI 只有 darwin / windows（mygo native UI 无 Linux 后端）
                if [ "$kind" = "gui" ] && [ "$os" = "linux" ]; then continue; fi
                ext=""; [ "$os" = "windows" ] && ext=".exe"
                out="dist/${kind}-${os}-${arch}${ext}"

                ld="$ldflags"
                # Windows GUI 双击不弹控制台（go install 传不了，另有 console_windows.go 兜底）
                if [ "$kind" = "gui" ] && [ "$os" = "windows" ]; then
                  ld="$ld -H=windowsgui"
                fi

                echo "→ $out"
                GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
                  go build -trimpath -ldflags "$ld" -o "$out" "./cmd/${kind}"
                made=$((made+1))
              done
            done
          done
          echo "built=$made" >> "$GITHUB_OUTPUT"
          echo "共 $made 个产物"
          ls -lh dist

      - name: Self-check binaries
        run: |
          set -euo pipefail
          # 每一类至少能在本机跑（跨架构的用 file 检查格式）
          ./dist/cli-darwin-arm64 version
          for f in dist/*; do
            file "$f" | sed 's/^/  /'
          done
          # GUI 的 Windows 产物必须是 GUI 子系统
          file dist/gui-windows-amd64.exe | grep -q "GUI" \
            || { echo "gui-windows 不是 GUI 子系统"; exit 1; }

      - name: Upload artifacts (给 npm job 用)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*
          retention-days: 3

      - name: Checksums
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dist && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 安装

            ### npm（一个包内含全平台 CLI / GUI / 服务端）

            ```bash
            npx reply9842@${{ github.ref_name }}          # 本地转发客户端
            npx reply9842-gui@${{ github.ref_name }}      # 图形界面
            npx reply9842-server@${{ github.ref_name }}   # 服务端

            npm i -g reply9842@${{ github.ref_name }}     # 或全局安装
            ```

            ### go install（需要 Go 1.27.3+）

            ```bash
            go install github.com/jixoai/reply9842/cmd/cli@${{ github.ref_name }}
            go install github.com/jixoai/reply9842/cmd/gui@${{ github.ref_name }}
            go install github.com/jixoai/reply9842/cmd/server@${{ github.ref_name }}
            ```

            ### 下载预编译二进制

            见下方 Assets，校验和见 `SHA256SUMS.txt`。

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── npm 独立 job：需要 environment + id-token，且要 Node 环境 ──────────
      # 单独成 job 是因为 environment 的保护规则与 OIDC 权限都按 job 生效；
      # needs 传递 dist 目录（self-hosted 与官方 runner 不共享文件系统，
      # 所以这里用 artifact 中转）。

  npm:
    name: Publish npm
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    # 必须与 npmjs.com Trusted Publisher 的 Environment name 完全一致
    environment: npm-publish
    runs-on: ubuntu-latest          # npm 发布用官方 runner 即可（无需自建）
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write               # OIDC 必需
    steps:
      - uses: actions/checkout@v4

      # 不传 registry-url：它会让 setup-node 写 NODE_AUTH_TOKEN 到 .npmrc，
      # npm 见到该变量就走 Basic Auth，OIDC 换来的凭证被忽略（实测 E404）。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Upgrade npm (Trusted Publishing 需要 CLI 11+)
        run: npm install -g npm@latest

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: npm/vendor

      - name: OIDC preconditions
        # npm 的 oidc() 在任一前置条件失败时只是 log.verbose + return undefined，
        # 最终统一表现为 ENEEDAUTH，无法从错误码区分。这步把条件逐个打印。
        run: |
          echo "npm: $(npm --version)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+set}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+set}"
          echo "NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-unset}"

      - name: Set version
        working-directory: npm
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.version = process.env.VERSION.replace(/^v/, "");
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
            console.log("version ->", p.version);
          '

      - name: Prepare package
        run: |
          set -euo pipefail
          chmod 0755 npm/vendor/cli-* npm/vendor/gui-* npm/vendor/server-* 2>/dev/null || true
          chmod 0644 npm/vendor/*.exe 2>/dev/null || true
          cp README.md LICENSE npm/

      - name: Publish
        working-directory: npm
        # 环境里绝不能有 NODE_AUTH_TOKEN（哪怕空串）：npm 会认为已有凭据配置，
        # OIDC 分支被跳过。同时清掉可能残留的 .npmrc。
        run: |
          rm -f ~/.npmrc .npmrc 2>/dev/null || true
          npm publish --provenance --access public --loglevel verbose

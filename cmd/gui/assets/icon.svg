<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">rfc9842-reply</title>
  <desc id="dsc">数字 9842 以复古粗衬线压进深灰铭牌的 2×2 等分格里。</desc>
  <!--
    ══ 版式：2×2 等分格 + 逐字墨迹归一化 ═══════════════════════════════
    画布 1024；格距 384，四格心固定在 (320|704, 320|704)；每个数字的**墨迹
    包围盒**归一到 300×300 方盒后放在格心。结果：墨迹块 684×684 严格正方，
    四条栏距恒为 84px，四边留白各 170px。

    为什么逐字归一化，而不是「统一字号 + 居中」：Alfa Slab One 用比例数字，
    四个字的墨迹宽天生不等（302/307/298/279 px）。统一字号居中会得到
    78/95/85/77 四个不等的栏距（差 18px，1024px 下肉眼可辨），墨迹块也变成
    687×757 的竖长条（宽高比 0.908），读作「一列数字」而不是「一块方阵」。
    归一化后栏距与行距恒等，宽高比 1.000。
    代价：每字带 4%~15% 的横向缩放（笔画横向略粗），服务「粗壮复古」的定位。

    ══ 对齐：中心对齐，不是边缘对齐 ═════════════════════════════════════
    右列 8 / 2 的左右外缘不齐（各约 ±7px）是**有意的**：比例数字里 2 比 8
    窄，边缘对齐会让右列看起来像被削过。两字中心都落在 x=703.5，光学居中正确。
    后人不要把它当 bug 改成 edge-align。

    ══ 硬朗度：路线 A（粗壮复古铭牌），不走路线 B ═══════════════════════
    Alfa Slab One 的字母带 slab 衬线，但数字 9/8 是纯圆几何形（直线边占比
    30%~40%），4/2 带平底衬线（48%~79%），气质本就不统一。手改 9/8 的字形
    路径（拉直碗形侧壁、斜切端点）能把硬朗度拉齐，但 16px 下 9/8 的字怀会
    消失——代价是毁掉小尺寸可读性，不划算。
    所以本图标定位为「粗壮复古的机加工铭牌」，锋利感由底板承担而非字形：
    近实色的底板、直角压边框、无模糊的硬边压入阴影。
    不要把这里读成「锋利的金属刻字」。

    ══ 满幅 vs 预圆角 ═══════════════════════════════════════════════════
    本 SVG 是满幅的（铺满 1024 画布、无透明留边）。macOS 14 起系统会把满幅
    图标自己裁成 squircle 并补边缘高光；若提交自带透明留边的预圆角图，系统
    会当成旧式图标、在外面套一块浅灰底板。Windows 侧不裁切，所以 .ico 由
    make_ico.py 另加约 8% 圆角（见该脚本），本文件保持满幅不变。
  -->
  <defs>
    <!--
      底板几乎是平的（#2A2A2A→#252525，亮度 42→37，约 1.14×）。这是被
      「上下排对比度失衡」逼出来的：WCAG 对比度的分母带 +0.05 泛光项，
      深灰段每降 5 级亮度比就跳 7%——原稿 #313131→#131313（49→19）的渐变
      必然让下排比上排重 25%，光学重心往下坠。墨色改成纯色（四个数字同亮度）
      后，底板就只能压平；材质感由压边框和压入阴影承担。
    -->
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2A2A"/>
      <stop offset="0.5" stop-color="#272727"/>
      <stop offset="1" stop-color="#252525"/>
    </linearGradient>

    <!--
      墨色与压入（deboss）明暗是同一条填充渐变：顶缘压暗 → 中段回正 →
      底缘一条窄反光，颜色值已经是「#F3EEDF 上合成黑色/白色透明度」之后的结果。
      四条路径各自按 objectBoundingBox 映射，所以四个数字的顶/底明暗完全一致
      （不会随行位置漂移）。

      物理语义：光从上方来 → 凹陷的**上内壁**朝下，接的是背面光，压暗；
      **下内壁**朝上正对光源，提亮。原稿的 feDropShadow dy=+4 是反的：
      阴影落在字形下方＝读作「浮雕凸起」，与「压进板里」的语义相反，
      且 64px 以下完全消失（实测 4.7/2.15/0.92 亮度差）。

      为什么不用 SVG 标准做法（clipPath + 蒙版叠加）：librsvg 2.63 会静默
      忽略 clipPath 内部的 <g>，clipPath 里的 <use> 指向分组同样失效，
      连 defs 里的 <use href="#digits"> 也不渲染——全部不报错、只是什么都不画，
      压入效果整块消失（四种写法都实测过）。
      所以这里只用最基础的一层填充 + objectBoundingBox 渐变：路径只需写一遍，
      也不依赖任何组合语义，跨渲染器（rsvg / WebKit / Chromium / skia）都稳。
    -->
    <linearGradient id="inkSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.0000" stop-color="#615F59"/>
      <stop offset="0.0096" stop-color="#77756D"/>
      <stop offset="0.0264" stop-color="#A39F95"/>
      <stop offset="0.0432" stop-color="#D0CCBF"/>
      <stop offset="0.0600" stop-color="#F3EEDF"/>
      <stop offset="0.9400" stop-color="#F3EEDF"/>
      <stop offset="0.9568" stop-color="#F6F2E6"/>
      <stop offset="0.9832" stop-color="#F9F7F0"/>
      <stop offset="1.0000" stop-color="#F6F2E7"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#plate)"/>

  <!--
    机加工铭牌的压边框：5px 暗槽 + 上沿 2px 亮线，读作「刻进去的槽」而非描边。
    直角；macOS 的 squircle 会削掉四角一点点，这是预期的。
  -->
  <g fill="none">
    <rect x="112" y="112" width="800" height="800" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
    <rect x="112" y="116" width="800" height="796" stroke="#0A0A0A" stroke-opacity="0.55" stroke-width="5"/>
  </g>

  <!-- 墨色与压入明暗同在一层：渐变直接给出合成后的颜色 -->
  <g fill="url(#inkSurface)">
    <path d="M0.68 -0.40Q0.68 -0.19 0.58 -0.09Q0.47 0.01 0.30 0.01Q0.22 0.01 0.16 0.00Q0.10 -0.01 0.06 -0.03V-0.23Q0.10 -0.22 0.15 -0.21Q0.20 -0.20 0.25 -0.20Q0.39 -0.20 0.39 -0.30V-0.31Q0.33 -0.29 0.26 -0.29Q0.14 -0.29 0.07 -0.35Q0.01 -0.41 0.01 -0.52Q0.01 -0.66 0.09 -0.72Q0.17 -0.79 0.33 -0.79Q0.50 -0.79 0.59 -0.70Q0.68 -0.60 0.68 -0.40ZM0.33 -0.44Q0.36 -0.44 0.39 -0.46V-0.54Q0.39 -0.58 0.38 -0.60Q0.36 -0.61 0.33 -0.61Q0.29 -0.61 0.27 -0.59Q0.26 -0.57 0.26 -0.53Q0.26 -0.49 0.27 -0.47Q0.29 -0.44 0.33 -0.44Z" transform="translate(165.52 466.25) scale(447.7612 375.0000)"/>
    <path d="M0.69 -0.21Q0.69 -0.10 0.60 -0.04Q0.52 0.01 0.35 0.01Q0.18 0.01 0.10 -0.04Q0.01 -0.10 0.01 -0.21Q0.01 -0.29 0.05 -0.34Q0.10 -0.38 0.16 -0.40Q0.10 -0.42 0.07 -0.47Q0.03 -0.51 0.03 -0.58Q0.03 -0.68 0.11 -0.74Q0.19 -0.79 0.35 -0.79Q0.51 -0.79 0.59 -0.74Q0.67 -0.68 0.67 -0.58Q0.67 -0.51 0.63 -0.46Q0.60 -0.42 0.55 -0.40Q0.61 -0.38 0.65 -0.34Q0.69 -0.29 0.69 -0.21ZM0.28 -0.54Q0.28 -0.48 0.35 -0.48Q0.42 -0.48 0.42 -0.54Q0.42 -0.61 0.35 -0.61Q0.28 -0.61 0.28 -0.54ZM0.43 -0.24Q0.43 -0.28 0.41 -0.31Q0.39 -0.33 0.35 -0.33Q0.31 -0.33 0.29 -0.31Q0.27 -0.28 0.27 -0.24Q0.27 -0.16 0.35 -0.16Q0.43 -0.16 0.43 -0.24Z" transform="translate(549.59 466.25) scale(441.1765 375.0000)"/>
    <path d="M0.34 0.00V-0.12H0.02V-0.29L0.36 -0.78H0.61V-0.28H0.68V-0.12H0.61V0.00ZM0.20 -0.28H0.34V-0.47Z" transform="translate(160.91 854.00) scale(454.5455 384.6154)"/>
    <path d="M0.01 -0.09Q0.01 -0.17 0.04 -0.24Q0.06 -0.30 0.12 -0.36Q0.18 -0.42 0.28 -0.48Q0.31 -0.50 0.32 -0.52Q0.34 -0.53 0.34 -0.55Q0.34 -0.59 0.28 -0.59Q0.23 -0.59 0.18 -0.57Q0.12 -0.54 0.07 -0.51L0.01 -0.72Q0.08 -0.75 0.16 -0.78Q0.24 -0.80 0.33 -0.80Q0.47 -0.80 0.54 -0.74Q0.62 -0.68 0.62 -0.57Q0.62 -0.51 0.59 -0.46Q0.57 -0.41 0.53 -0.38Q0.49 -0.35 0.43 -0.31Q0.36 -0.27 0.33 -0.24Q0.30 -0.21 0.30 -0.16H0.42V-0.22H0.63V0.00H0.01Z" transform="translate(549.16 854.00) scale(483.8710 375.0000)"/>
  </g>
</svg>

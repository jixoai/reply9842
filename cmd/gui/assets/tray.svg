<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="135.67 135.67 752.40 752.40" role="img" aria-labelledby="ttl">
  <title id="ttl">rfc9842-reply 托盘图标（template）</title>
  <!--
    菜单栏 / 通知区域用的**模板图标**：纯黑 + 透明，没有底板、没有渐变、没有落影。

    为什么必须去掉 icon.svg 的深灰底板与暖白油墨：
      template 图标的规则是「只有 alpha 有意义，颜色由系统给」——系统按菜单栏
      明暗把整张图染成黑或白。原图标的深色底会跟着一起染色：深色菜单栏上变成
      一块白方块，比旁边的系统图标重得多；浅色菜单栏上变成黑方块。所以托盘版
      只留字形，底色交给系统（IconIsTemplate: true）。

    为什么仍是 2×2 田字格：这就是品牌标记的版式（Dock 图标同一套）。换成单行
    「9842」在 16px 的通知区域里会糊成一条灰带，2×2 至少保住「四宫格」这个
    轮廓特征。

    画布裁剪：viewBox 收在墨迹外扩 5% 的范围（墨迹实测 169.87,169.87 →
    853.88,853.88，即 684×684 正方——逐字墨迹归一化的结果）。
    方形画布经 mygo 按高度等比缩放到 18pt 后正好 18×18，字形填满菜单栏高度。

    字形数据与 icon.svg 逐字相同（同一份衬线贝塞尔）。改字形要先改主图，
    再同步这里——两者共用一套 path，只是底色与裁剪不同。
  -->
  <defs>
